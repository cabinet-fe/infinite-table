<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>infinite-table vs VTable 性能对比</title>
    <style>
      body {
        margin: 0;
        background: #f8fafc;
      }
      #app {
        padding: 24px 16px;
      }
      #table-host {
        position: relative;
        /* 对比跑完即清空；跑动期间用于挂载被测表格（1280×720 视口） */
        overflow: hidden;
      }
      #running {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 13px;
        color: #6b7280;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="running">
        对比运行中：10 万与 100 万行两个规模，各按 [infinite-table → VTable → VTable →
        infinite-table] 对称跑序执行，预计 3~8 分钟…
      </div>
      <div id="report"></div>
      <div id="table-host"></div>
    </div>
    <script type="module" src="/src/vs/main.ts"></script>
  </body>
</html>
